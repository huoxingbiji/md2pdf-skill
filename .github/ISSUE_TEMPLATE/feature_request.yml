name: 功能建议
description: 建议新的转换、排版、保护或质检能力
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景和问题
      description: 请说明当前流程为什么不能满足需求。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的命令、输入和输出行为。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议与 Markdown 转 PDF、页面质量或 Codex Skill 使用直接相关。
          required: true
        - label: 示例中不包含敏感数据。
          required: true
