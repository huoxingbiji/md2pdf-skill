name: 错误报告
description: 报告转换、排版、公式、图表或质检问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请先删除文档、日志和路径中的敏感信息。

  - type: input
    id: version
    attributes:
      label: md2pdf 版本
      placeholder: 例如 1.2.0 或提交号
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / Node.js 24 / Python 3.12 / Edge
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 执行命令
      description: 删除密码、令牌和敏感绝对路径。
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
      description: 可附上已脱敏的最小 Markdown、QA JSON 或问题页截图。
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issues。
          required: true
        - label: 我已经删除客户数据、密码、令牌和其他敏感信息。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
